[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotenv"
version = "0.2.1"
description = "Robot embodiments as validated, hashable data, instantiated in batched RL environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "robotdesigner>=0.1"]

[project.optional-dependencies]
env = [
    "torch>=2.7",
    "tensordict>=0.14.3,<0.15",
    "torchrl>=0.14.1,<0.15",
    "mujoco>=3.13",
]
warp = ["robotenv[env]", "mujoco-warp>=3.13", "warp-lang>=1.15"]
robosuite = ["robotenv[env]", "robosuite>=1.5,<1.6"]
menagerie = [
    "robotenv[env]",
    "mujoco-menagerie>=2026.9.0; python_full_version >= '3.10.12'",
]
# ManiSkill pins mplib==0.1.1 on Linux, which has wheels for CPython 3.10 to 3.12 only and no source distribution:
# without the marker the extra cannot be installed (or locked into a working environment) on Python 3.13.
maniskill = ["robotenv[env]", "mani_skill>=3.0,<3.1; python_full_version < '3.13'"]
yaml = ["pyyaml"]
viz = ["imageio", "imageio-ffmpeg", "pillow"]
dev = ["pytest", "ruff", "pyyaml"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
robotdesigner = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/robotenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device",
    "robosuite: needs the robosuite extra",
    "render: needs an OpenGL context",
    "menagerie: needs the menagerie extra and a model download",
    "maniskill: needs the maniskill extra",
]
