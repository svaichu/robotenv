[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotdesigner"
version = "0.1.0"
description = "Parametric robot arms as validated, hashable data (numpy only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# eliminate_joints and the "reduced" robot provider work on robotenv's ExternalRobot and need MuJoCo; robotenv itself
# is not a dependency (it depends on this package), install it with its "env" extra.
mujoco = ["mujoco>=3.13"]
dev = ["pytest"]

[project.entry-points."robotenv.robot.providers"]
reduced = "robotdesigner.provider:PROVIDER"

[tool.hatch.build.targets.wheel]
packages = ["src/robotdesigner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
