[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotdesigner"
version = "0.1.0"
description = "Parametric robot arms as validated, hashable data (numpy only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/robotdesigner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
